<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-1">Leave Management</h2>
            <p class="text-muted mb-0">Track leave requests and approvals.</p>
        </div>
        <a routerLink="/dashboard" class="btn btn-outline-secondary">Back to Dashboard</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped mb-0">
                <thead>
                    <tr>
                        <th>Employee</th>
                        <th>Leave Type</th>
                        <th>Days</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of leaveRequests">
                        <td>{{ item.employee }}</td>
                        <td>{{ item.type }}</td>
                        <td>{{ item.days }}</td>
                        <td>
                            <span class="badge"
                                [ngClass]="item.status === 'Approved' ? 'bg-success' : 'bg-warning text-dark'">
                                {{ item.status }}
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
