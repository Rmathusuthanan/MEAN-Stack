<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off">

    <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" autocomplete="username" placeholder="Enter your email">

        <small class="text-danger" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
            Please enter a valid email.
        </small>
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" autocomplete="current-password"
            placeholder="Enter your password">

        <small class="text-danger" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
            Password is required.
        </small>
    </div>

    <div *ngIf="error" class="text-danger">
        {{ error }}
    </div>

    <button type="submit" [disabled]="loginForm.invalid">
        Login
    </button>

</form>
