<div class="dashboard-container container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Dashboard</h1>
        <button class="btn btn-danger" type="button" (click)="logout()">
            Logout
        </button>
    </div>

    <div class="mb-3">
        <a routerLink="/employee" class="btn btn-primary">
            Manage Employees
        </a>
    </div>

    <div *ngIf="employees.length; else emptyState" class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Salary</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let employee of employees">
                    <td>{{ employee.name }}</td>
                    <td>{{ employee.department }}</td>
                    <td>{{ employee.designation }}</td>
                    <td>{{ employee.salary | currency:'USD' }}</td>
                    <td>{{ employee.status }}</td>
                </tr>
            </tbody>
        </table>
    </div>

    <ng-template #emptyState>
        <div class="alert alert-info">
            No employees found yet. Create employees in the employee management page.
        </div>
    </ng-template>
</div>
